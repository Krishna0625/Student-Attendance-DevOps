apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-attendance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-attendance
  template:
    metadata:
      labels:
        app: student-attendance
    spec:
      containers:
        - name: attendance-app
          image: student-attendance:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: /app/data
          volumeMounts:
            - name: attendance-storage
              mountPath: /app/data
      volumes:
        - name: attendance-storage
          emptyDir: {}
